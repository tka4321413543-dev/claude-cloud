<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <meta name="mobile-web-app-capable" content="yes">
  <title>My Live</title>
  <style>
    :root { --bg: #0e0f13; --fg: #e8eaed; --muted: #9aa0a6; --user: #2b3445; --model: #1c1f26; --line: #333842; --accent: #8ab4f8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    header b { font-weight: 600; }
    #log { flex: 1; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.model { align-self: flex-start; background: var(--model); }
    .msg.tool { align-self: center; color: var(--muted); font-size: 13px; text-align: center; }
    #controls { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 16px; }
    #orb { width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
      background: radial-gradient(circle at 35% 35%, #c58af9, #4285f4 60%, #1a237e); transition: transform .2s; }
    #orb[data-state="listening"] { animation: pulse 2s infinite; }
    #orb[data-state="speaking"] { animation: pulse .8s infinite; transform: scale(1.06); }
    #orb[data-state="connecting"] { opacity: .6; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(138,180,248,.55); } 100% { box-shadow: 0 0 0 28px rgba(138,180,248,0); } }
    #status { color: var(--muted); font-size: 14px; }
    .row { display: flex; gap: 8px; width: 100%; }
    #textForm { flex: 1; display: flex; gap: 8px; }
    input, select, textarea, button { background: var(--model); color: var(--fg); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; font: inherit; }
    button { white-space: nowrap; cursor: pointer; }
    input, select, textarea { width: 100%; min-width: 0; }
    #textForm input { flex: 1; }
    button.primary { background: #4285f4; border-color: #4285f4; color: #fff; }
    #settings { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; padding: 16px; display: none; }
    #settings.open { display: block; }
    #settings h2 { margin: 4px 0 12px; font-size: 20px; }
    #settings label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 14px; }
    #settings .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
    #settings a { color: var(--accent); }
    #notes { list-style: none; padding: 0; margin: 8px 0; }
    #notes li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    #notes li span { overflow: hidden; text-overflow: ellipsis; }
    #notes li button { padding: 4px 10px; font-size: 13px; }
  </style>
</head>
<body>
  <header><b>My Live</b><button id="openSettings" aria-label="Cài đặt">⚙️ Cài đặt</button></header>
  <div id="log"></div>
  <div id="controls">
    <button id="orb" aria-label="Bắt đầu / dừng"></button>
    <div id="status">Chạm để bắt đầu</div>
    <div class="row">
      <button id="mute" type="button">🎙️ Mic bật</button>
      <form id="textForm"><input id="text" placeholder="Hoặc gõ câu hỏi…" autocomplete="off"><button>Gửi</button></form>
    </div>
  </div>

  <div id="settings">
    <h2>Cài đặt</h2>
    <div class="hint">Mọi thứ ở đây chỉ lưu trong trình duyệt của điện thoại này, không gửi đi đâu ngoài Google Gemini API.</div>

    <label for="apiKey">Gemini API key</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="AIza...">
    <div class="hint">Lấy ở <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a></div>

    <label for="model">Model (Live API)</label>
    <div class="row"><select id="model"></select><button id="loadModels" type="button">Tải danh sách</button></div>

    <label for="voice">Giọng</label>
    <select id="voice">
      <option value="">Mặc định</option>
      <option>Puck</option><option>Charon</option><option>Kore</option><option>Fenrir</option>
      <option>Aoede</option><option>Leda</option><option>Orus</option><option>Zephyr</option>
    </select>

    <label for="profile">Hồ sơ cá nhân (luôn được đưa vào system prompt)</label>
    <textarea id="profile" rows="5" placeholder="Tên tôi là..., tôi làm nghề..., tôi thích được gọi là..."></textarea>

    <label>Dữ liệu cá nhân (file .md / .txt / .json / .csv), model tự tìm khi bạn hỏi</label>
    <input id="noteFiles" type="file" multiple accept=".md,.txt,.json,.csv,.yaml,.yml,.log,text/*">
    <ul id="notes"></ul>

    <label for="agentUrl">(Tùy chọn) URL AI agent của bạn</label>
    <input id="agentUrl" placeholder="https://.../ask">
    <div class="hint">Phải là HTTPS và bật CORS. Trang sẽ POST {"question": "..."} tới đây.</div>

    <div class="row" style="margin-top:20px">
      <button id="saveSettings" class="primary" type="button" style="flex:1">Lưu</button>
      <button id="closeSettings" type="button">Đóng</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
