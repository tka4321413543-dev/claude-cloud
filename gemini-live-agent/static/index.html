<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f13">
  <title>My Live</title>
  <style>
    :root { --bg: #0e0f13; --fg: #e8eaed; --muted: #9aa0a6; --user: #2b3445; --model: #1c1f26; --accent: #8ab4f8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
    #log { flex: 1; overflow-y: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.model { align-self: flex-start; background: var(--model); }
    .msg.tool { align-self: center; color: var(--muted); font-size: 13px; background: none; }
    #controls { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 0 16px; }
    #orb { width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
      background: radial-gradient(circle at 35% 35%, #c58af9, #4285f4 60%, #1a237e);
      box-shadow: 0 0 0 0 rgba(138,180,248,.5); transition: transform .2s; }
    #orb[data-state="listening"] { animation: pulse 2s infinite; }
    #orb[data-state="speaking"] { animation: pulse .8s infinite; transform: scale(1.06); }
    #orb[data-state="connecting"] { opacity: .6; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(138,180,248,.55); } 100% { box-shadow: 0 0 0 28px rgba(138,180,248,0); } }
    #status { color: var(--muted); font-size: 14px; }
    #row { display: flex; gap: 8px; width: 100%; }
    #textForm { flex: 1; display: flex; gap: 8px; }
    input, button.small { background: var(--model); color: var(--fg); border: 1px solid #333842; border-radius: 10px; padding: 10px 12px; font: inherit; white-space: nowrap; }
    input { flex: 1; min-width: 0; }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="controls">
    <button id="orb" aria-label="Bắt đầu / dừng"></button>
    <div id="status">Chạm để bắt đầu</div>
    <div id="row">
      <button id="mute" class="small" type="button">🎙️ Mic bật</button>
      <form id="textForm"><input id="text" placeholder="Hoặc gõ câu hỏi…" autocomplete="off"><button class="small">Gửi</button></form>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
